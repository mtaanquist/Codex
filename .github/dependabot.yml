version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Keep noise down: one PR per week for routine updates. Major versions
      # stay out of the group and arrive as their own PRs, so one breaking
      # upgrade does not block the rest.
      all-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']
      # The SvelteKit 3 major (#613) has to move kit, the adapter and the Vite
      # plugin together; separate PRs would each fail on peers.
      sveltekit-major:
        patterns: ['@sveltejs/kit', '@sveltejs/adapter-node', '@sveltejs/vite-plugin-svelte']
        update-types: ['major']
    ignore:
      # svelte-check, SvelteKit 3 and typescript-eslint all still peer on
      # typescript below 7, so a bump fails npm ci and takes the whole grouped
      # PR down with it. Drop this entry once all three accept typescript 7.
      - dependency-name: typescript
        versions: ['7.x']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
