name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'staging/**']

jobs:
  quality:
    name: Lint, check, unit, build
    runs-on: ubuntu-latest
    env:
      # The backup store's multipart round trip against a throwaway RustFS
      # (tests/integration/s3-backup-store.test.ts), started in a step below.
      TEST_S3_ENDPOINT: http://localhost:9000
      TEST_S3_BUCKET: codex-backups-test
      TEST_S3_ACCESS_KEY_ID: codex-rustfs
      TEST_S3_SECRET_ACCESS_KEY: codex-rustfs-secret
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: codex
          POSTGRES_PASSWORD: codex
          POSTGRES_DB: codex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install postgresql-client-18 (backup round-trip test)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -so /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          # The runner image preinstalls an older client; put 18 first.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Start RustFS (backup store test)
        run: .github/scripts/start-rustfs.sh "$TEST_S3_ACCESS_KEY_ID" "$TEST_S3_SECRET_ACCESS_KEY" "$TEST_S3_BUCKET"
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test:unit -- --run
      - run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://codex:codex@localhost:5432/codex
      # Asset uploads against a throwaway RustFS, started in a step below.
      ASSET_S3_ENDPOINT: http://localhost:9000
      ASSET_S3_REGION: us-east-1
      ASSET_S3_BUCKET: codex-assets
      ASSET_S3_ACCESS_KEY_ID: codex-rustfs
      ASSET_S3_SECRET_ACCESS_KEY: codex-rustfs-secret
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: codex
          POSTGRES_PASSWORD: codex
          POSTGRES_DB: codex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Start RustFS (asset uploads)
        run: .github/scripts/start-rustfs.sh "$ASSET_S3_ACCESS_KEY_ID" "$ASSET_S3_SECRET_ACCESS_KEY" "$ASSET_S3_BUCKET"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker-smoke:
    name: Docker stack boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: docker compose -f compose.yaml up -d --build
      - name: App responds
        run: curl --retry 12 --retry-delay 5 --retry-all-errors -fsS -o /dev/null http://localhost:3000/login
      - name: Worker stays up
        # The worker imports from src/lib at runtime; a missing file in the
        # image crash-loops here, which CI's host-spawned e2e never sees.
        run: |
          sleep 10
          state=$(docker inspect -f '{{.State.Status}} restarts={{.RestartCount}}' codex-worker-1)
          echo "worker: $state"
          [ "$state" = "running restarts=0" ]
          docker logs codex-worker-1 2>&1 | grep -q '"event":"worker.started"'
      - name: First-admin bootstrap runs in the image
        # seed-admin runs raw under Node in the image, like the worker; a
        # missing-extension import fails only here, never in the host-run tests.
        # The script exits non-zero on any failure, so this step gates on it.
        run: >-
          docker compose -f compose.yaml exec -T -e ADMIN_PASSWORD=ci-bootstrap-pw
          app node scripts/seed-admin.ts ci-admin@example.com "CI Admin"
      - name: Worker renders a PDF
        # The image's Chromium must be found and launch; an Alpine package
        # change that moves or breaks it fails PDF exports only in production.
        run: >-
          docker compose -f compose.yaml exec -T worker node --import ./src/worker/register.js --input-type=module -e
          "const { renderEditionPdf } = await import('/app/src/lib/server/export-artifacts.ts');
          const pdf = await renderEditionPdf('<p>smoke</p>');
          if (new TextDecoder().decode(pdf.slice(0, 5)) !== '%PDF-') process.exit(1);
          console.log('pdf bytes', pdf.length);"
      - name: Form posts pass the origin check
        # SvelteKit refuses a form POST whose Origin does not match the app's
        # origin, which the image takes from ORIGIN at runtime. A same-origin
        # sign-in must go through and a foreign one must be refused; a change
        # in how the origin is resolved (as in adapter-node 6) breaks every
        # form in the app, and nothing else here posts one. The image reads the
        # client address from X-Forwarded-For (Caddy sets it in production), so
        # the request carries one, and it asks for HTML as a browser does
        # (otherwise SvelteKit answers the action with JSON).
        run: |
          post() {
            curl -s -o /dev/null -w '%{http_code} %{redirect_url}' -X POST \
              -H "Origin: $1" -H 'X-Forwarded-For: 203.0.113.7' -H 'Accept: text/html' \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode 'email=ci-admin@example.com' \
              --data-urlencode 'password=ci-bootstrap-pw' \
              http://localhost:3000/login
          }
          same=$(post http://localhost:3000)
          echo "same origin: $same"
          [ "$same" = "303 http://localhost:3000/" ]
          foreign=$(post http://evil.example)
          echo "foreign origin: $foreign"
          [ "${foreign%% *}" = "403" ]
      - name: Show logs on failure
        if: failure()
        run: docker compose -f compose.yaml logs
