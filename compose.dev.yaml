# Database and asset storage, for editor-hosted development. The full stack
# (app, worker, Caddy) lives in compose.yaml. The explicit project name keeps
# this stack's containers and volumes separate from the full stack's.
name: codex-dev

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: codex
      POSTGRES_PASSWORD: codex
      POSTGRES_DB: codex
    ports:
      - '${DEV_DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codex']
      interval: 5s
      timeout: 5s
      retries: 10

  # Asset storage for development. Unlike the deployment stack's RustFS, this
  # one publishes its ports: the app and the tests run on the host here, not
  # inside the compose network. Exports and image uploads stay hidden until
  # asset storage is configured, so the end-to-end suite needs this running.
  rustfs:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-codex-rustfs}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-codex-rustfs-secret}
    ports:
      - '${DEV_RUSTFS_PORT:-9000}:9000'
      - '${DEV_RUSTFS_CONSOLE_PORT:-9001}:9001'
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket on first start, then exits. A signed PUT
  # with the image's own curl; 409 means the bucket already exists.
  rustfs-init:
    image: rustfs/rustfs:1.0.3
    depends_on:
      rustfs:
        condition: service_healthy
    restart: 'no'
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-codex-rustfs}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-codex-rustfs-secret}
    entrypoint:
      - sh
      - -c
      - >
        code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT
        --aws-sigv4 aws:amz:us-east-1:s3 --user "$$RUSTFS_ACCESS_KEY:$$RUSTFS_SECRET_KEY"
        http://rustfs:9000/codex-assets);
        [ "$$code" = 200 ] || [ "$$code" = 409 ] || { echo "creating codex-assets failed: $$code"; exit 1; }

volumes:
  db-data:
  rustfs-data:
