<!-- @dsCard group="Foundations" -->
<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Type</title>
		<link rel="stylesheet" href="styles/tokens.css" />
		<link rel="stylesheet" href="kit.css" />
		<style>
			.t-sample {
				margin-bottom: 16px;
			}
			.t-tag {
				font-size: 10.5px;
				color: var(--text-faint);
				margin-bottom: 3px;
			}
		</style>
	</head>
	<body>
		<div class="themes" id="themes"></div>
		<template id="sample">
			<div class="t-sample">
				<div class="t-tag">font-ui (Hanken Grotesk) - all chrome</div>
				<div style="font-family: var(--font-ui); font-size: 13.5px">
					Chapters are organisational; scenes own the prose.
				</div>
			</div>
			<div class="t-sample">
				<div class="t-tag">font-serif (Spectral) - prose and display headings</div>
				<div style="font-family: var(--font-serif); font-size: 17px; line-height: 1.6">
					The first winter after the burning of the archive, Halden walked the treaty road
					alone.
				</div>
			</div>
			<div class="t-sample">
				<div class="t-tag">font-mono (JetBrains Mono) - identifiers and code</div>
				<div style="font-family: var(--font-mono); font-size: 12.5px">scene_markers</div>
			</div>
			<div class="t-sample">
				<div class="t-tag">UI sizes in current use (no named ramp yet)</div>
				<div style="font-family: var(--font-ui)">
					<div style="font-size: 15px">15px - pane titles</div>
					<div style="font-size: 13.5px">13.5px - body chrome</div>
					<div style="font-size: 12.5px">12.5px - secondary rows</div>
					<div style="font-size: 11.5px">11.5px - meta and counts</div>
				</div>
			</div>
			<p class="note">
				The kit falls back to system faces; the app loads the real families via fontsource.
				Sizes are ad hoc today; a small named ramp is proposed in the primitive consolidation
				brief.
			</p>
		</template>
		<script src="kit.js"></script>
	</body>
</html>
