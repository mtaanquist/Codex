<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script nonce="%sveltekit.nonce%">
			// Set the theme before first paint to avoid a flash. The theme
			// picker (applyAppearance) writes the same localStorage key.
			(function () {
				var theme = 'light';
				function concrete(v, fallback) {
					return v === 'light' || v === 'warm' || v === 'dark' ? v : fallback;
				}
				try {
					var stored = localStorage.getItem('codex-theme');
					if (stored === 'light' || stored === 'warm' || stored === 'dark') {
						theme = stored;
					} else {
						// No stored choice means "follow system": resolve through the
						// saved light/dark mappings.
						var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
						theme = prefersDark
							? concrete(localStorage.getItem('codex-system-dark'), 'dark')
							: concrete(localStorage.getItem('codex-system-light'), 'light');
					}
				} catch (e) {
					/* default stands */
				}
				document.documentElement.setAttribute('data-theme', theme);
				document.documentElement.setAttribute('data-density', 'comfortable');
				try {
					var accent = localStorage.getItem('codex-accent');
					if (accent && /^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(accent))
						document.documentElement.style.setProperty('--accent', accent);
				} catch (e) {
					/* default accent stands */
				}
				// Side column widths chosen by dragging (src/lib/pane-widths.ts). Only
				// the chosen width is taken from storage; the floor and the cap are
				// rebuilt from the current bounds, which a unit test keeps equal to
				// PANE_BOUNDS.
				try {
					var paneRe = /^clamp\(\d+px, (\d+)px, \d+vw\)$/;
					var paneBounds = { left: [264, 30], right: [312, 40] };
					['left', 'right'].forEach(function (side) {
						var m = paneRe.exec(localStorage.getItem('codex-' + side + '-w') || '');
						if (m)
							document.documentElement.style.setProperty(
								'--' + side + '-w',
								'clamp(' +
									paneBounds[side][0] +
									'px, ' +
									m[1] +
									'px, ' +
									paneBounds[side][1] +
									'vw)'
							);
					});
				} catch (e) {
					/* default widths stand */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<!-- Code preloads when a link scrolls into view, not on hover: inserting
	     preload links into the head mid-hover makes Safari and Firefox drop the
	     hand cursor (they only recompute it on mouse movement). Data preload
	     stays on hover; a fetch does not touch the DOM. -->
	<body data-sveltekit-preload-data="hover" data-sveltekit-preload-code="viewport">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
